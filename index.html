<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EmojiDance Choreographer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>💃 EmojiDance</h1>
        <p>Map your next viral hit</p>
    </header>

    <main>
        <section id="routine-container">
            <div id="current-routine" class="routine-display">
                <!-- Emojis will appear here -->
            </div>
            <div class="routine-controls">
                <button id="clear-btn" class="btn-secondary">Clear</button>
                <button id="save-btn" class="btn-primary">Save Routine</button>
            </div>
        </section>

        <section id="emoji-palette">
            <h3>Move Palette</h3>
            <div class="palette-grid" id="palette">
                <!-- Emojis generated by JS -->
            </div>
        </section>

        <section id="saved-routines">
            <h3>My Routines</h3>
            <div id="routines-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
